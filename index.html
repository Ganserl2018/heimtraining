<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Home Force</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Home Force">
<meta name="theme-color" content="#121818">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Home Force</h1>
    <button class="tv-icon-btn" id="tvIconBtn" title="TV-Ansicht" aria-label="TV-Ansicht">📺</button>
  </header>

  <main id="content">
  </main>

  <nav class="tabbar" id="tabbar">
    <div class="side-brand"><img src="logo.svg" alt="" width="40" height="40"><div><b>HOME FORCE</b><span id="side-mood">—</span></div></div>
    <button class="tab side-start" data-view="start"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span class="tab-lb">Workout starten</span></button>
    <button class="tab active" data-view="overview"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="tab-lb">Übersicht</span></button>
    <button class="tab" data-view="weeklist"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="tab-lb">Wochenplan</span></button>
    <div id="weekplan-block"></div>
    <button class="tab" data-view="allex"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 8v8M17.5 8v8M3.5 10v4M20.5 10v4M6.5 12h11"/></svg><span class="tab-lb">Alle Übungen</span></button>
    <div id="allex-block"></div>
    <button class="tab tab-sep" data-view="history"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span class="tab-lb">Verlauf</span></button>
    <button class="tab tab-profile" data-view="profile"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c1-4 4-5.5 7.5-5.5s6.5 1.5 7.5 5.5"/></svg><span class="tab-lb">Profil</span></button>
    <button class="tab side-me" data-view="profile"><span class="side-av" id="side-av">◉</span><span class="side-nm" id="side-nm">Profil</span></button>
  </nav>

  <script src="script.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
